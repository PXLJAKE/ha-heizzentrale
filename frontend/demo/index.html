<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heizzentrale – Demo</title>
<style>
  :root { --primary-color:#03a9f4; --primary-text-color:#212121; --secondary-text-color:#727272;
    --card-background-color:#fff; --secondary-background-color:#f1f3f5; --divider-color:#dcdfe3;
    --error-color:#db4437; --info-color:#039be5; --success-color:#43a047; --warning-color:#ffa600; --page:#fafafa; --primary-background-color:#fafafa; }
  :root.dark { --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --card-background-color:#1c1c1c;
    --secondary-background-color:#2a2a2a; --divider-color:#3a3a3a; --page:#111; --primary-background-color:#111; }
  body { margin:0; padding:16px; background:var(--page); color:var(--primary-text-color);
    font-family: Roboto, "Segoe UI", system-ui, sans-serif; }
  ha-card { display:block; background:var(--card-background-color); border-radius:12px;
    border:1px solid var(--divider-color); }
  main { max-width: 1000px; margin: 0 auto; }
</style>
</head>
<body>
<main><heizzentrale-house-card id="card"></heizzentrale-house-card></main>
<script type="module">
// Demo data only: invented values for a plant shaped like the first test
// installation. Nothing here talks to a real Home Assistant.
import "../../custom_components/heizzentrale/frontend/heizzentrale-card.js";
const q = new URLSearchParams(location.search);
if (q.get("theme") === "dark") document.documentElement.classList.add("dark");
const T = (v) => ({ state: String(v), attributes: { unit_of_measurement: "°C" } });
const B = (v) => ({ state: v, attributes: {} });
const room = (cur, tgt, action, preset, state = "heat") => ({ state,
  attributes: { current_temperature: cur, temperature: tgt, hvac_action: action, preset_mode: preset,
    preset_modes: ["comfort", "eco", "sleep", "away"], hvac_modes: ["heat", "off"], target_temp_step: 0.5, min_temp: 5, max_temp: 30 } });
const states = {
  "select.mode": { state: "observe", attributes: { options: ["off", "observe"] } },
  "sensor.outside": T(4.6),
  "sensor.boiler": T(68.4), "sensor.boiler_state": B("heating"),
  "sensor.buf_top": T(62.1), "sensor.buf_mid": T(51.3), "sensor.buf_bottom": T(38.2), "sensor.buf_mean": T(50.5),
  "sensor.pg_vl": T(56.2), "sensor.pg_rl": T(45.3), "binary_sensor.pg_pump": B("on"),
  "sensor.eg_vl": T(55.8), "sensor.eg_rl": T(46.9), "sensor.eg_spread": B("8.9"), "binary_sensor.eg_open": B("on"),
  "sensor.og_vl": T(55.6), "sensor.og_rl": T(44.1), "sensor.og_spread": B("11.5"), "binary_sensor.og_open": B("on"),
  "sensor.dg_vl": T(31.2), "sensor.dg_rl": T(29.8), "sensor.dg_spread": B("1.4"), "binary_sensor.dg_open": B("off"),
  "sensor.saal_vl": T(27.4), "sensor.saal_rl": T(26.9), "sensor.saal_spread": B("0.5"), "binary_sensor.saal_open": B("off"),
  "climate.dg_schlafen": room(19.8, 19.5, "idle", "sleep"),
  "climate.dg_bad": room(21.9, 22, "idle", "comfort"), "binary_sensor.dg_bad_fenster": B("off"),
  "climate.dg_kueche": room(20.4, 20, "idle", "eco"),
  "climate.og_wohnen": room(20.6, 22, "heating", "comfort"),
  "climate.og_schlafen": room(18.2, 18, "idle", "eco"),
  "climate.og_bad": room(21.1, 23, "heating", "comfort"),
  "climate.og_saal": room(16.8, 16.5, "idle", "eco"),
  "climate.eg_wohnen": room(21.4, 22, "heating", "comfort"),
  "climate.eg_bad": room(22.3, 22, "idle", "comfort"), "binary_sensor.eg_bad_fenster": B("on"),
  "climate.eg_kueche": room(20.9, 21, "idle", "comfort"),
  "climate.eg_buero": room(19.1, 20.5, "heating", "comfort"),
  "climate.keller_schlafen": room(17.6, 17, "idle", "eco"),
};
const c = (id, name, system) => ({ id, name, system_type: system, flow_entity: `sensor.${id}_vl`, return_entity: `sensor.${id}_rl`,
  valve_entity: `switch.${id}`, valve_type: "nc", pump_group: "pg", spread_entity: `sensor.${id}_spread`, open_entity: `binary_sensor.${id}_open` });
const r = (id, name, climate, circuit, floor, win) => ({ id, name, climate_entity: climate, circuit, floor, window_entities: win ? [win] : [] });
const plant = { entry_id: "demo", name: "Heizung", mode_entity: "select.mode", outdoor_entity: "sensor.outside",
  heat_sources: [{ id: "k", name: "Pellematic", kind: "pellet", temperature_entity: "sensor.boiler", status_entity: "sensor.boiler_state" }],
  buffers: [{ id: "p", name: "Puffer", sensor_entities: ["sensor.buf_top", "sensor.buf_mid", "sensor.buf_bottom"], volume: 550, mean_entity: "sensor.buf_mean" }],
  pump_groups: [{ id: "pg", name: "Pumpengruppe", flow_entity: "sensor.pg_vl", return_entity: "sensor.pg_rl", status_entity: "binary_sensor.pg_pump", control_entity: "switch.hk1" }],
  circuits: [c("eg", "EG", "one_pipe"), c("og", "OG", "one_pipe"), c("dg", "DG", "two_pipe"), c("saal", "Saal", "two_pipe")],
  floors: [{ id: "dg", name: "Dachgeschoss", level: 2 }, { id: "og", name: "1. Obergeschoss", level: 1 }, { id: "eg", name: "Erdgeschoss", level: 0 }, { id: "ke", name: "Keller", level: -1 }],
  rooms: [
    r("r1", "Schlafzimmer", "climate.dg_schlafen", "dg", "dg"), r("r2", "Bad", "climate.dg_bad", "dg", "dg", "binary_sensor.dg_bad_fenster"), r("r3", "Küche/Flur", "climate.dg_kueche", "dg", "dg"),
    r("r4", "Wohnzimmer", "climate.og_wohnen", "og", "og"), r("r5", "Schlafzimmer", "climate.og_schlafen", "og", "og"), r("r6", "Bad", "climate.og_bad", "og", "og"), r("r7", "Saal", "climate.og_saal", "saal", "og"),
    r("r8", "Wohn-/Esszimmer", "climate.eg_wohnen", "eg", "eg"), r("r9", "Bad", "climate.eg_bad", "eg", "eg", "binary_sensor.eg_bad_fenster"), r("r10", "Küche", "climate.eg_kueche", "eg", "eg"), r("r11", "Büro", "climate.eg_buero", "eg", "eg"),
    r("r12", "Schlafzimmer Eltern", "climate.keller_schlafen", "eg", "ke"),
  ] };
// ?panel=1 shows the sidebar page instead of the bare card.
let card = document.getElementById("card");
if (q.get("panel")) {
  document.body.style.padding = "0";
  const panel = document.createElement("heizzentrale-panel");
  document.querySelector("main").replaceWith(panel);
  await panel.updateComplete;
  const inner = panel.shadowRoot.querySelector("heizzentrale-house-card");
  card = { setConfig() {}, set hass(value) { panel.hass = value; }, _select: (x) => inner._select(x) };
}
if (q.get("empty")) { for (const k of ["heat_sources", "buffers", "pump_groups", "circuits", "rooms", "floors"]) plant[k] = []; }
if (q.get("partial")) { plant.rooms = []; plant.floors = []; plant.pump_groups = []; }
card.setConfig({});
Object.assign(states, {
  "person.jake": { state: "not_home", attributes: { friendly_name: "Jake" } },
  "person.mama": { state: "home", attributes: { friendly_name: "Mama" } },
  "device_tracker.jake_iphone": { state: "not_home", attributes: { friendly_name: "Jake iPhone" } },
  "device_tracker.mama_handy": { state: "home", attributes: { friendly_name: "Mama Handy (Unifi)" } },
});
const WORK = [0, 1, 2, 3, 4];
const control = { enabled: false, active_rules: ["a1"],
  schedules: [
    { id: "s1", name: "Werktage", rooms: [], floors: ["eg", "og"], points: [
      { days: WORK, time: "06:00", action: "preset:comfort" }, { days: WORK, time: "22:00", action: "preset:eco" },
      { days: [5, 6], time: "08:00", action: "preset:comfort" }, { days: [5, 6], time: "23:00", action: "preset:eco" }] },
    { id: "s2", name: "Bad morgens warm", rooms: ["r6"], floors: [], points: [
      { days: [0, 1, 2, 3, 4, 5, 6], time: "05:30", action: "temperature:23" }, { days: [0, 1, 2, 3, 4, 5, 6], time: "08:00", action: "preset:eco" }] },
  ],
  rules: [
    { id: "a1", name: "Jake unterwegs", entities: ["device_tracker.jake_iphone"], delay_min: 0, rooms: [], floors: ["dg"], action: "off" },
    { id: "a2", name: "Mama nicht da", entities: ["device_tracker.mama_handy"], delay_min: 10, rooms: [], floors: ["eg"], action: "preset:eco" },
  ],
  rooms: { r1: { action: "off", source: "absence", name: "Jake unterwegs", applied: false }, r4: { action: "preset:comfort", source: "schedule", name: "Werktage", applied: false } } };
if (q.get("empty") || q.get("partial")) { control.schedules = []; control.rules = []; control.rooms = {}; control.active_rules = []; }
const PRESETS = { comfort: "Komfort", eco: "Eco", sleep: "Schlafen", away: "Abwesend" };
const hass = () => ({ states: { ...states }, language: q.get("lang") || "de", callWS: async (msg) => {
    if (msg.type === "heizzentrale/control/get") return control;
    if (msg.type === "heizzentrale/control/save") { for (const k of ["enabled", "schedules", "rules"]) if (k in msg) control[k] = msg[k]; return { ...control }; }
    return { plants: [plant] };
  },
  formatEntityAttributeValue: (_s, _a, v) => (q.get("lang") === "en" ? v : PRESETS[v] ?? v),
  callService: async (_d, service, data) => {
    const old = states[data.entity_id];
    if (service === "set_temperature") states[data.entity_id] = { ...old, attributes: { ...old.attributes, temperature: data.temperature } };
    if (service === "set_preset_mode") states[data.entity_id] = { ...old, attributes: { ...old.attributes, preset_mode: data.preset_mode } };
    if (service === "set_hvac_mode") states[data.entity_id] = { ...old, state: data.hvac_mode };
    if (service === "select_option") states[data.entity_id] = { ...old, state: data.option };
    card.hass = hass();
  } });
card.hass = hass();
if (q.get("view")) setTimeout(() => { card._view = q.get("view"); }, 300);
// ?edit=schedule or ?edit=rule opens the first one in the editor.
if (q.get("edit")) setTimeout(() => {
  const el = (card.renderRoot ?? card.shadowRoot).querySelector("heizzentrale-control");
  if (q.get("edit") === "schedule") el._schedule = structuredClone(control.schedules[0]);
  else el._rule = structuredClone(control.rules[1]);
  el.scrollIntoView();
}, 600);
const pick = q.get("select");
if (pick) setTimeout(() => { const [kind, id] = pick.split(":"); card._select({ kind, id }); }, 300);
</script>
</body>
</html>
