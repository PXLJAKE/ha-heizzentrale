name: Release

# Pushing a tag like v0.2.0 or v0.2.0-beta.1 creates the GitHub release.
# Tags with a suffix (-beta.1, -rc.1) become pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/heizzentrale/manifest.json'))['version'])")
          base="${TAG#v}"
          base="${base%%-*}"
          if [ "$base" != "$version" ]; then
            echo "Tag $TAG does not match manifest version $version" >&2
            exit 1
          fi
      - name: Build ZIP
        run: |
          cd custom_components/heizzentrale
          zip -r "$GITHUB_WORKSPACE/heizzentrale.zip" . -x '*/__pycache__/*'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" heizzentrale.zip --title "$TAG" --generate-notes $flags
